; PlatformIO 工程配置 —— ESP32-S3-DevKitC-1 蓝牙(BLE)控制
;
; 常用命令（在 VSCode 底部状态栏点图标，或命令行执行）：
;   pio run                 编译
;   pio run -t upload       编译并烧录
;   pio device monitor      打开串口监视器（115200）
;
; 板子：ESP32-S3-DevKitC-1，搭载 ESP32-S3-WROOM-1U (N8R2: 8MB Flash + 2MB PSRAM)
; 注意：本工程不使用 PSRAM，N8R2 的 2MB PSRAM 保持闲置。
;
; 本工程没有任何第三方库依赖：
;   · BLE 协议栈   -> Arduino-ESP32 框架自带
;   · 板载 WS2812  -> 核心自带 rgbLedWrite() 驱动
; 因此编译只需下载一次工具链，之后离线也能编。

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; —— 如果你用的是板上标着 "USB" 的那个 Type-C 口（原生 USB，不是 UART 口）——
; 取消下面一行注释，否则串口监视器看不到任何输出
; （参考工程的 Arduino 配置用的就是 CDCOnBoot=cdc，即走原生 USB 口）
; build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
